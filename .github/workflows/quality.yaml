name: Quality Checks

on:
  workflow_call:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PDM
        uses: pdm-project/setup-pdm@94a823180e06fcde4ad29308721954a521c96ed0 # v4
        with:
          cache: true
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: pdm install --frozen-lockfile -G dev -G test -G docs

      - name: Format Check
        run: pdm run format:check

      - name: Lint Check
        run: pdm run lint

      - name: Type Check
        run: pdm run typecheck

      - name: Generated Files Check
        run: pdm run generate:check

      - name: Tests
        run: pdm run tests
